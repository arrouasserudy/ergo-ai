# Sends the parents' SMS meeting reminders that are due (see src/lib/meetings/reminder-timing.ts:
# the day before, during the day, never on Shabbat). The request wakes the Fly machine if stopped.
# Needs the CRON_SECRET repository secret, set to the same value as the app's CRON_SECRET Fly secret.
name: Reminders

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET is not set; skipping."; exit 0; fi
          curl --fail-with-body --silent --show-error --max-time 120 --retry 3 --retry-all-errors \
            -X POST -H "Authorization: Bearer $CRON_SECRET" https://ergo-ai.fly.dev/api/cron/reminders
