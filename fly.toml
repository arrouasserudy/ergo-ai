app = "ergo-ai"
primary_region = "cdg"

[build]

[env]
  BETTER_AUTH_URL = "https://ergo-ai.fly.dev"
  DATABASE_PATH = "/data/ergoai.db"
  # The practice's local time: display and time-of-day patterns (the server runs in UTC).
  APP_TIME_ZONE = "Asia/Jerusalem"
  # Heap cap under the 512 MB machine (PDF parsing for the expert's library needs headroom).
  NODE_OPTIONS = "--max-old-space-size=380"

# Migrations: no release_command, because release machines don't get the volume
# (they would migrate an empty throwaway database). The app applies pending Drizzle
# migrations when it boots (src/instrumentation-node.ts) and exits if one fails: the
# migrations run in one transaction (the database is left untouched), the health check
# never passes and the deploy is reported as failed. Fix forward, or roll back with
# `fly deploy --image <previous image>` (`fly releases --image` lists them).
# Deploys run from GitHub Actions on every push to main (.github/workflows/deploy.yml).
[deploy]
  strategy = "rolling"
  wait_timeout = "5m"

# SQLite lives on a persistent volume attached to the single machine.
[mounts]
  source = "ergo_ai_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/login"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
